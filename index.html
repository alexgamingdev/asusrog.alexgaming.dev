<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL-CORE 2048 - Main Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #020205; color: #00f0ff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .top-bar { background-color: #05050a; border-bottom: 2px solid #00f0ff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #008899; letter-spacing: 2px; }
        .top-bar span { color: #00f0ff; text-shadow: 0 0 8px rgba(0,240,255,0.6); }
        .main-container { display: flex; flex: 1; height: calc(100vh - 41px); position: relative; }
        .gameplay-section { flex: 1.2; background: #000; position: relative; border-right: 2px solid #001522; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .simulation-canvas { width: 100%; height: 100%; background: radial-gradient(circle at center, #001122 0%, #000002 90%); position: relative; }
        .sim-grid { position: absolute; width: 300%; height: 300%; top: -100%; left: -100%; background-image: linear-gradient(rgba(0, 240, 255, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.08) 1px, transparent 1px); background-size: 30px 30px; transform: perspective(600px) rotateX(65deg); animation: gridMove 6s linear infinite; }
        @keyframes gridMove { 0% { transform: perspective(600px) rotateX(65deg) translateY(0); } 100% { transform: perspective(600px) rotateX(65deg) translateY(30px); } }
        .ai-core-pulse { position: absolute; width: 220px; height: 220px; background: rgba(0, 240, 255, 0.1); border-radius: 50%; box-shadow: 0 0 80px rgba(0, 240, 255, 0.4); animation: pulse 2.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.5); opacity: 0.8; } }
        .floating-particles { position: absolute; width: 100%; height: 100%; background-image: radial-gradient(#00f0ff 1px, transparent 1px); background-size: 50px 50px; animation: floatParticles 15s linear infinite; opacity: 0.3; }
        @keyframes floatParticles { 0% { background-position: 0 0; } 100% { background-position: 100px 500px; } }
        .watermark-ai { position: absolute; bottom: 20px; left: 20px; color: rgba(0, 240, 255, 0.5); font-size: 11px; text-transform: uppercase; letter-spacing: 3px; }
        .portal-section { flex: 1; background-color: #040408; padding: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 10px 0 30px rgba(0,0,0,0.9); text-align: center; }
        .logo-container { width: 90px; height: 90px; margin-bottom: 20px; filter: drop-shadow(0 0 12px rgba(0,240,255,0.5)); }
        .logo-container img { width: 100%; height: 100%; object-fit: contain; }
        .portal-content h2 { color: #fff; font-size: 24px; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 15px; text-shadow: 0 0 10px rgba(0,240,255,0.4); }
        .portal-content p { color: #008899; font-size: 13px; margin-bottom: 30px; letter-spacing: 1px; }
        .enter-btn { background: linear-gradient(135deg, #00f0ff 0%, #007788 100%); color: #000; border: none; padding: 20px 40px; font-size: 18px; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; cursor: pointer; box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); transition: all 0.3s ease; text-decoration: none; display: inline-block; }
        .enter-btn:hover { background: linear-gradient(135deg, #33f3ff, #0099aa); box-shadow: 0 0 40px rgba(0, 240, 255, 0.8); transform: scale(1.03); }
    </style>
</head>
<body>
    <div class="top-bar">
        <div>NEURAL SECURE STREAM: <span>CONNECTED // 2048.7.27</span></div>
        <div>TERMINAL ID: <span>NODE_OMEGA_X</span></div>
    </div>
    <div class="main-container">
        <div class="gameplay-section">
            <div class="simulation-canvas">
                <div class="sim-grid"></div>
                <div class="floating-particles"></div>
                <div class="ai-core-pulse"></div>
            </div>
            <div class="watermark-ai">Neural Engine v14.0 // Autonomous Simulation Running</div>
        </div>
        <div class="portal-section">
            <div class="portal-content">
                <div class="logo-container">
                    <img src="logo.svg" alt="Neural Core Logo">
                </div>
                <h2>Warenkorb-Gateway</h2>
                <p>Zugriff auf das unbezahlbare High-End Hardware-Kontingent</p>
                <a href="cart/" class="enter-btn">[ WARENKORB ÖFFNEN ]</a>
            </div>
        </div>
    </div>
</body>
</html>
